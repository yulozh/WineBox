name: Build YuixServer IPA

# 触发方式：
#   1) 在 Actions 页手动 Run workflow（workflow_dispatch）
#   2) 推送到 main/master 分支自动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 失败时用 GITHUB_TOKEN 自动创建 Issue 报告错误（便于诊断闭环）
permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本（沿用 runner 默认，已含 iOS SDK）
        run: xcodebuild -version

      - name: 安装构建工具（XcodeGen + meson/ninja/llvm/lld，后四者用于引擎）
        run: brew install xcodegen meson ninja llvm lld

      - name: 构建 Linux 引擎（ish 内核 + asbestos JIT，arm64 静态库）
        run: |
          chmod +x scripts/build-engine.sh
          ./scripts/build-engine.sh 2>&1 | tee engine-build.log | tail -30

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解码签名材料
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

      - name: 导入证书
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null 2>&1 || true

      - name: 安装描述文件
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/5f1e8b56-a7e9-49e5-8ede-349fef46cb0f.mobileprovision"

      - name: 归档 (archive)
        run: |
          set -o pipefail
          xcodebuild -project YuixServer.xcodeproj -scheme YuixServer -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/YuixServer.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=283M9R6THP \
            PROVISIONING_PROFILE_SPECIFIER="5f1e8b56-a7e9-49e5-8ede-349fef46cb0f" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -150

      - name: 导出 IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/YuixServer.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -50

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: YuixServer-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      # ---------- 失败诊断（以下仅在失败时运行）----------

      - name: 上传完整构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
            engine-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 失败时创建 Issue 报告错误
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 构建失败报告"
            echo ""
            echo "- Run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- 触发者: ${{ github.actor }}"
            echo "- 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### 错误摘要（去重）"
            echo '```'
            grep -hE "error:|fatal error:|Undefined symbol|Undefined symbols|linker command|ARCHIVE FAILED|BUILD FAILED|No such file|xcodebuild: error" \
              "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" engine-build.log 2>/dev/null \
              | sort -u | head -100 || echo "(未匹配到已知错误模式，见下方日志末尾)"
            echo '```'
            echo ""
            echo "### archive 日志末尾（150 行）"
            echo '```'
            tail -150 "$RUNNER_TEMP/archive.log" 2>/dev/null || echo "(无 archive.log)"
            echo '```'
          } > issue-body.md
          gh issue create \
            --title "CI 构建失败 run #${{ github.run_number }}（${{ github.sha }}）" \
            --body-file issue-body.md \
            --label "ci-failure" 2>/dev/null || \
          gh issue create \
            --title "CI 构建失败 run #${{ github.run_number }}（${{ github.sha }}）" \
            --body-file issue-body.md
