name: Build YuixServer IPA

# 触发方式：
#   1) 在 Actions 页手动 Run workflow（workflow_dispatch）
#   2) 推送到 main/master 分支自动触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 显示 Xcode 版本（沿用 runner 默认，已含 iOS SDK）
        run: xcodebuild -version

      - name: 安装构建工具（XcodeGen + meson/ninja/llvm/lld，后四者用于引擎）
        run: brew install xcodegen meson ninja llvm lld

      - name: 构建 Linux 引擎（ish 内核 + asbestos JIT，arm64 静态库）
        run: |
          chmod +x scripts/build-engine.sh
          ./scripts/build-engine.sh

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 解码签名材料
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

      - name: 导入证书
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" >/dev/null 2>&1 || true

      - name: 安装描述文件
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/5f1e8b56-a7e9-49e5-8ede-349fef46cb0f.mobileprovision"

      - name: 归档 (archive)
        run: |
          set -o pipefail
          xcodebuild -project YuixServer.xcodeproj -scheme YuixServer -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/YuixServer.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=283M9R6THP \
            PROVISIONING_PROFILE_SPECIFIER="5f1e8b56-a7e9-49e5-8ede-349fef46cb0f" \
            archive 2>&1 | tail -150

      - name: 导出 IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/YuixServer.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" 2>&1 | tail -50

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: YuixServer-IPA
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30