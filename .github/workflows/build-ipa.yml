name: Build & Sign IPA

# 触发方式：
#   1) 在 Actions 页手动 Run workflow（workflow_dispatch）
#   2) 推送以 v 开头的 tag（如 v0.1.0），方便版本化出包
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: |
          brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 导入证书与描述文件（用于签名）
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          PROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          mkdir -p certs
          echo "$P12_BASE64" | base64 --decode > certs/cert.p12
          echo "$PROVISION_BASE64" | base64 --decode > certs/profile.mobileprovision

          # 创建临时钥匙串
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 导入 .p12（口令来自 secret，绝不明文写入仓库）
          security import certs/cert.p12 \
            -k build.keychain \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A

          # 允许 codesign 无提示访问私钥
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # 安装描述文件到 Xcode 可识别的路径
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp certs/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "== 可用的签名身份 =="
          security find-identity -v -p codesigning build.keychain

      - name: 归档 (archive)
        run: |
          xcodebuild -project YuixServer.xcodeproj \
            -scheme YuixServer \
            -configuration Release \
            -archivePath build/YuixServer.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=283M9R6THP \
            CODE_SIGN_IDENTITY='iPhone Distribution' \
            PROVISIONING_PROFILE_SPECIFIER=5f1e8b56-a7e9-49e5-8ede-349fef46cb0f \
            archive

      - name: 导出 IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/YuixServer.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/

      - name: 列出产物
        run: ls -la build/

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: YuixServer.ipa
          path: build/*.ipa
          retention-days: 30