# YuixServer 工程配置（使用 XcodeGen 生成 .xcodeproj）
# 生成方式：在项目根目录执行 `xcodegen generate`
# 或：在 Xcode 中新建 SwiftUI iOS 工程后，将 YuixServer/ 目录源码拖入，并添加 ZIPFoundation 依赖。
#
# 签名说明：Bundle ID 已设为描述文件锁定的 `app.star2977.grape6286`，
# 采用 Manual 签名 + TeamID 283M9R6THP，配合用户上传的 .p12 与 .mobileprovision。
# 实际出包由 GitHub Actions（macos 云端机）编译并签名，见 .github/workflows/build-ipa.yml。

name: YuixServer
options:
  deploymentTarget:
    iOS: "16.0"
  objectVersion: 56          # 强制生成 Xcode 14 兼容格式，避免 CI 上低版本 Xcode 读不了新格式(77)
  createIntermediateGroups: true

# 仅一个第三方依赖：ZIPFoundation（用于 .zip 压缩导出/导入），纯 Swift、App Store 合规。
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  YuixServer:
    type: application
    platform: iOS
    sources:
      # 应用源码（Swift + Linux 引擎封装的 .m/.c）。
      # Info.plist 由 XcodeGen 按 info: 段自动生成并自动排除。
      - path: YuixServer
        excludes:
          - "Resources/**"
      # 内置 Alpine rootfs 与 node polyfill —— 必须进 resources 构建阶段
      # （root.tar.gz / rootfs.sha256 / *.js 均为非编译资源）。
      # 运行时经 [NSBundle URLForResource:] 读取，rootfs 损坏会拒绝导入。
      - path: YuixServer/Resources
        buildPhase: resources
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.star2977.grape6286
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"       # 同时支持 iPhone 与 iPad
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 283M9R6THP
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        # ---- 内置 Alpine Linux 引擎（engine/，由 scripts/build-engine.sh 产出）----
        SWIFT_OBJC_BRIDGING_HEADER: YuixServer/YuixServer-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/engine"
        # ISH_INTERNAL：engine/fs/fake.h 等内部头文件的保护宏（引擎 .c 自带
        # #define，应用侧 YX*.m/.c 经 Xcode 编译需要在此统一定义）
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) GUEST_ARM64=1 ENGINE_ASBESTOS=1 LOG_HANDLER_NSLOG=1 ISH_INTERNAL=1"
        # 注意：不能用 -lresolv —— iOS SDK 里没有 libresolv.tbd（那是 macOS 专属），
        # iOS 的 res_ninit/res_getservers 符号在 libSystem 中，无需显式链接。
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/engine/build/libish.a $(SRCROOT)/engine/build/libish_emu.a $(SRCROOT)/engine/build/libfakefs.a -lsqlite3 -lz"
        # 引擎 C 代码是 C11 + 部分 GNU 扩展，与 Swift 混编目标关掉严格警告即不足以报错
        GCC_WARN_64_TO_32_BIT_CONVERSION: NO
    info:
      path: YuixServer/Info.plist
      properties:
        CFBundleDisplayName: YuixServer
        UILaunchScreen: {}                 # 现代应用必需的启动屏占位
        UIFileSharingEnabled: true         # 在「文件」App 中可见沙盒 Documents，便于导入/导出
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - ish
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - yuixserver
        NSLocalNetworkUsageDescription: "YuixServer 需要访问本地网络以显示设备的局域网 IP，并允许同一 Wi-Fi 下的其他设备访问你启动的服务。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # 允许内置浏览器打开 http://127.0.0.1 与局域网地址做端口测试
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait